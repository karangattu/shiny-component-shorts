# Set orientations: [vertical] here and pass --orientation vertical for portrait-only exports.
# Build the stills, then assemble them around the live clips in interaction-shot.yaml.
context:
  layout: showcase
  label: Shiny for Python · Plotly
  title: Compare two forecasts
  summary: See the forecast change as you switch scenarios.
  captures:
    vertical: sources/result-vertical.png
    horizontal: sources/result-horizontal.png
shots:
  - cue: I install Shiny and the widget packages
    chapter: Run the app
    views:
      vertical:
        code_theme: dark
        code_wrap: false
        font_size: 30
        panels:
          - {kind: code, file: setup.sh, language: bash, label: ""}
      horizontal:
        layout: columns
        code_theme: dark
        code_wrap: false
        panels:
          - {kind: code, file: setup.sh, language: bash, label: ""}
          - {kind: image, file: sources/app-horizontal-code.png}
  - cue: The render function reads the selected value
    chapter: Connect the forecast
    views:
      vertical:
        code_theme: dark
        code_wrap: false
        font_size: 32
        panels:
          - {kind: code, file: app.py, lines: [5, 8]}
      horizontal:
        layout: columns
        code_theme: dark
        code_wrap: false
        panels:
          - {kind: code, file: app.py, lines: [5, 8]}
          - {kind: image, file: sources/app-horizontal-code.png}
