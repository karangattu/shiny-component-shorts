# Split one continuous recording into these clips.
# Keep the pointer approach, the real response, and a short hold on the result.
shots:
  - cue: I switch this chart from new accounts to churn
    chapter: Change the metric
    views:
      vertical: {file: sources/opening-vertical.mp4, fit: contain, in: 0}
      horizontal: {file: sources/opening-horizontal.mp4, fit: contain, in: 0}
  - cue: Plotly's hover still works
    chapter: Keep Plotly's controls
    views:
      vertical: {file: sources/interaction-vertical.mp4, fit: contain, in: 0}
      horizontal: {file: sources/interaction-horizontal.mp4, fit: contain, in: 0}
  - cue: the legend still toggles the series
    chapter: Read the result
    views:
      vertical: {file: sources/payoff-vertical.mp4, fit: contain, in: 0}
      horizontal: {file: sources/payoff-horizontal.mp4, fit: contain, in: 0}
