name: Contract tests

'on':
  push:
    paths-ignore:
      - '**.md'
      - 'presentation/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'presentation/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      # the validator probes real media, so the demo fixtures need a real encoder
      - name: Ensure ffmpeg is available
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m unittest discover -s tests -p "test_*_contract.py" -v

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt pyrefly types-PyYAML
      - run: >-
          pyrefly check
          tests
          .claude/skills/shiny-component-shorts/scripts
          .agents/skills/shiny-component-shorts/scripts

