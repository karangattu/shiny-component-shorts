name: Contract tests

'on':
  workflow_call:
  push:
    branches: ['**']
    tags-ignore: ['v*']
    paths-ignore:
      - '**.md'
      - 'presentation/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'presentation/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest==8.4.2 Pillow==11.3.0
      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      # the validator probes real media, so the demo fixtures need a real encoder
      - name: Ensure ffmpeg is available
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m unittest discover -s tests -p "test_*_contract.py" -v
      - run: python -m pytest tests/test_editorial.py -q

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt pyrefly types-PyYAML pytest==8.4.2 Pillow==11.3.0
      - run: >-
          pyrefly check
          scripts
          tests
          .claude/skills/shiny-component-shorts/scripts
          .agents/skills/shiny-component-shorts/scripts

