name: Publish skill release

'on':
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/contract-tests.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Package tracked skill files
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/package_release.py --tag "$TAG" --output dist
      - name: Publish release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Bootstrap pins GitHub's "latest" release, so only the highest version
          # may claim it, even when an older tag finishes publishing later.
          highest=$(gh api "repos/$GH_REPO/tags" --paginate -q '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          latest=false
          if [ "$TAG" = "$highest" ]; then latest=true; fi
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --latest="$latest" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --latest="$latest" --generate-notes
          fi
