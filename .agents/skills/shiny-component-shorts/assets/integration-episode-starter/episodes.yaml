# Catalog for the "You Can Build This with Shiny" series.
# One entry per episode, in release order. Read references/widget-integration-episodes.md first.
#
# Every entry was checked against posit-dev/py-shinywidgets at commit 71162da (2026-11-13).
# The gallery changes: before you plan an episode, open its app.py and confirm that the
# accessor, the renderer, and each control named in `demo` still exist.
#
# Source:  website/gallery/<gallery>/app.py in posit-dev/py-shinywidgets
# Page:    https://posit-dev.github.io/py-shinywidgets/gallery/<gallery>/index.html
# install: taken from the example's requirements.txt. It also goes on the end card, where a line
#          holds 32 characters: keep every word at or under that length, so no word breaks.
# title:   the cover title. Keep it at 32 characters or fewer, or the portrait cover rejects it.
# released: false means the renderers and the shinywidgets[...] extras are not on PyPI yet
#          (PyPI had 0.8.2 on 2026-11-14). Until that changes, install shinywidgets from the
#          repository to record, and leave the command off the end card.
# look:    the planned variety for this episode: caption style, code theme, the order of the two
#          middle beats, and the side the code sits on in landscape. look.py assigns it
#          and applies it. Do not choose these by hand.
# closing_line: every episode ends on this sentence, spoken over the end card. Change only the
#          word "integration" to "widget" when the episode shows one library.
series: You Can Build This with Shiny
closing_line: To try this integration, go to the py-shinywidgets website.
site: shinywidgets.org
released: false
# look_seed: look.py draws each episode's look from this number and the episode id.
look_seed: 2026
gallery_repo: posit-dev/py-shinywidgets
gallery_root: website/gallery
gallery_url: https://posit-dev.github.io/py-shinywidgets/gallery
checked_at: 71162da
episodes:
  - id: plotly-lasso
    gallery: templates/plotly-lasso-explorer
    example: Lasso explorer
    integration: [Plotly, ITables]
    label: Shiny for Python · Plotly
    title: Lasso a chart to filter a table
    look: {captions: series, accent: '#03C7E8', hook_style: scale-lead, code_theme: dark, order: code-integration, code_side: right}
    renderers: [render_plotly, render_itables]
    accessor: plot.selected_rows(df)
    also: [plot.clicked()]
    install: pip install 'shinywidgets[plotly,itables]'
    hook: Lasso a handful of points in the scatter plot. The table below keeps only those rows.
    demo:
      - Show GDP per person against life expectancy.
      - Lasso a cluster of countries and show the matching rows.
      - Click one country to open its detail card.
    payoff: An existing Plotly chart becomes the filter for the rest of the app.
    audience: Exploratory data analysis
    complexity: easy

  - id: lonboard-city-map
    gallery: templates/lonboard-city-explorer
    example: World city explorer
    integration: [Lonboard, ITables]
    label: Shiny for Python · Lonboard
    title: Filter a table from a map
    look: {captions: series, accent: '#00BF7F', hook_style: two-way, code_theme: light, order: integration-code, code_side: left}
    renderers: [render_lonboard, render_itables]
    accessor: map.selected_bounds()
    also: [map.selected()]
    install: pip install 'shinywidgets[lonboard,itables]' geopandas shapely
    hook: Drag the Select BBox tool across part of Europe. The table fills with the cities inside the box.
    demo:
      - Click one city to show its name, country, and population.
      - Drag a selection box over a second region and show the table change.
    payoff: A selection on the map is the only filter the app needs.
    audience: Geospatial data, such as transport, public health, and environmental monitoring
    complexity: easy
    notes: Keep the map attribution visible.

  - id: k3d-terrain
    gallery: showcases/terrain-explorer
    example: Terrain explorer
    integration: [K3D]
    label: Shiny for Python · K3D
    title: Click terrain to read elevation
    look: {captions: series, accent: '#66B2FF', hook_style: direct-action, code_theme: light, order: code-integration, code_side: right}
    renderers: [render_k3d]
    accessor: terrain.camera()
    install: pip install 'shinywidgets[k3d]' matplotlib numpy
    hook: Orbit the terrain, then click a peak. The elevation at that point appears.
    demo:
      - Click two more locations and read their elevations.
      - Press "Fly to highest point" and let the camera finish moving.
      - Turn on the Wireframe checkbox to show the surface geometry.
    payoff: The app reads the camera and the clicked point, and Python changes the scene without rebuilding it.
    audience: Elevation models, geoscience, and engineering simulations
    complexity: medium
    notes: The clicked point arrives through the plot's click_callback, not through an accessor. Do not show a picked-point accessor.

  - id: perspective-trading-desk
    gallery: showcases/trading-desk
    example: Live trading desk
    integration: [Perspective]
    label: Shiny for Python · Perspective
    title: A live table filters a dashboard
    look: {captions: series, accent: '#F9B928', hook_style: outcome-first, code_theme: dark, order: integration-code, code_side: left}
    renderers: [render_perspective]
    accessor: grid.view_config()
    install: pip install 'shinywidgets[perspective]' pandas numpy
    hook: Trades stream into the table. Filter the table to one sector, and the value boxes recompute.
    demo:
      - Switch the left viewer between Blotter, Pivot, and Heatmap.
      - Open the viewer settings and filter to the technology sector.
      - Show the treemap and the value boxes following the filter while trades keep arriving.
    payoff: The filters a person sets inside the table are reactive values in Python.
    audience: Real-time analytics and operations dashboards
    complexity: medium
    notes: The data is simulated. Say so once in narration. Streaming numbers differ between takes, so do not narrate exact values.

  - id: jscatter-single-cell
    gallery: showcases/single-cell-atlas
    example: 300,000 cells -- lasso to explore
    integration: [jupyter-scatter]
    label: Shiny for Python · jupyter-scatter
    title: Lasso 300,000 linked points
    look: {captions: series, accent: '#E879F9', hook_style: scale-lead, code_theme: light, order: integration-code, code_side: right}
    renderers: [render_jscatter]
    accessor: umap.selected()
    install: pip install 'shinywidgets[jscatter]' pandas numpy
    hook: Lasso a group in one scatter plot. The same cells light up in the second plot.
    demo:
      - Lasso one cluster and show the composition percentages update.
      - Press "Find the top 1% CD3E cells" and show both plots select them.
    payoff: A selection travels to Python as row numbers, so the app does not resend the points.
    audience: Computational biology, genomics, and embeddings
    complexity: medium
    notes: The cells are synthetic. Say so once in narration.

  - id: ipycytoscape-network
    gallery: showcases/les-miserables-network
    example: Les Misérables network
    integration: [ipycytoscape, NetworkX]
    label: Shiny for Python · ipycytoscape
    title: Click a network to see who links
    look: {captions: series, accent: '#F45100', hook_style: direct-action, code_theme: dark, order: code-integration, code_side: left}
    renderers: [render_ipycytoscape]
    accessor: network.clicked_node()
    also: [network.selected_nodes(), network.clicked_edge()]
    install: pip install 'shinywidgets[ipycytoscape]' networkx
    hook: Click one character. The rest of the network fades and that character's direct connections stay.
    demo:
      - Click Valjean and show his strongest connections.
      - Choose two characters under "Shortest path between" and show the path through the graph.
    payoff: NetworkX computes, ipycytoscape draws, and a click joins the two.
    audience: Dependencies, organizations, and knowledge graphs
    complexity: medium

  - id: mols2grid-chemistry
    gallery: showcases/chemical-explorer
    example: Chemical explorer
    integration: [mols2grid, RDKit, Plotly]
    label: Shiny for Python · mols2grid
    title: Filter molecules with a lasso
    look: {captions: series, accent: '#66B2FF', hook_style: outcome-first, code_theme: light, order: code-integration, code_side: right}
    renderers: [render_mols2grid, render_plotly]
    accessor: grid.clicked()
    also: [grid.selected(), scatter.selected_rows(MOLS)]
    install: pip install 'shinywidgets[mols2grid,plotly]' matplotlib pandas
    hook: Lasso the heavy molecules in the scatter plot. The grid keeps only those structures.
    demo:
      - Press the arrow button on one structure to open its detail card.
      - Lasso a second group and show the grid change without a rebuild.
    payoff: The structure grid takes part in the same filters as the chart and the sliders.
    audience: Compound screening and chemical research
    complexity: specialized
    notes: >-
      RDKit installs as a mols2grid dependency. The grid is inside the widget's iframe, so its
      buttons are points. The arrow button opens the card; a click on the drawing does not.
      Produced on 2026-11-14 with the portrait copy's sidebar closed and its checkbox card removed.

  - id: ipyleaflet-map-chat
    gallery: showcases/map-chart-chat
    example: Map + chart + chat
    integration: [ipyleaflet, Plotly, shinychat, chatlas]
    label: Shiny for Python · ipyleaflet
    title: Ask a chat to move the map
    look: {captions: series, accent: '#00BF7F', hook_style: two-way, code_theme: dark, order: integration-code, code_side: left}
    renderers: [render_ipyleaflet, render_plotly]
    accessor: map.bounds()
    install: pip install 'shinywidgets[ipyleaflet]' 'shinywidgets[plotly]' shinychat chatlas anthropic pandas
    hook: Type "Fly to the West Island" in the chat. The map moves and the bar chart updates.
    demo:
      - Pan the map to a new area and show the bar chart change.
      - Ask the chat what is visible on the map and show an answer that matches the chart.
    payoff: The chart and the chat tools read the same map bounds, so they always agree.
    audience: Apps where a language model inspects and controls components through tools
    complexity: advanced
    notes: >-
      A video never calls a real LLM. Record a production copy whose chat replies and tool calls
      are scripted, keep map.bounds() and the fly_to code path real, and say "simulated reply" once
      in narration. State that the gallery app needs an LLM provider and credentials.
